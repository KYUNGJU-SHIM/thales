<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한전 여유용량 조회</title>
    <style>
        /* 70대 맞춤형 시각/터치 요소 최적화 */
        :root {
            --primary: #0047AB; 
            --bg-color: #F8F9FA;
            --text-color: #111111;
            --border-radius: 12px;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            font-size: 28px;
            text-align: center;
            margin-bottom: 30px;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 20px;
            font-size: 22px; 
            border: 2px solid #ccc;
            border-radius: var(--border-radius);
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
        }

        button:active {
            background-color: #003380;
        }

        /* 탭 디자인 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: #E0E0E0;
            color: #333;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        /* 검색 영역 디자인 (입력창 + 검색버튼) */
        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-area input[type="text"] {
            margin-bottom: 0; /* 하단 여백 제거 */
            flex: 1; /* 남은 공간 모두 차지 */
        }

        .search-area button {
            width: 100px; /* 검색 버튼 너비 */
            margin-bottom: 0;
            font-size: 22px;
            padding: 0; /* 버튼 내 글씨 중앙 정렬을 위해 */
        }

        /* 카드 UI */
        .card {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            border-left: 6px solid var(--primary);
        }

        .card-title {
            font-size: 26px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .card-region {
            font-size: 18px;
            color: #555;
            margin-bottom: 15px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .data-row:last-child {
            border-bottom: none;
        }

        .capacity {
            font-weight: bold;
            color: #D32F2F; 
        }

        #loading {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
            display: none;
            margin-top: 30px;
        }

        #main-view { display: none; }
    </style>
</head>
<body>

    <!-- 화면 A: 로그인 뷰 -->
    <div id="login-view" class="container">
        <h1>여유용량 통합 검색</h1>
        <p style="font-size: 18px; text-align: center;">담당자 확인을 위해<br>비밀번호를 입력해 주세요.</p>
        <input type="password" id="pwd-input" placeholder="비밀번호 입력">
        <button id="login-btn">접속하기</button>
        <p id="login-error" style="color: red; font-size: 18px; text-align: center; display: none;">비밀번호가 일치하지 않습니다.</p>
    </div>

    <!-- 화면 B: 메인 검색 뷰 -->
    <div id="main-view" class="container">
        <!-- 탭 버튼 (변전소명 먼저) -->
        <div class="tabs">
            <button id="tab-substation" class="tab-btn active">변전소명 검색</button>
            <button id="tab-region" class="tab-btn">지역명 검색</button>
        </div>

        <!-- 검색 입력창 & 버튼 (수동 검색) -->
        <div class="search-area">
            <input type="text" id="search-input" placeholder="예: 가락, 마포, 신길">
            <button id="search-btn">검색</button>
        </div>
        
        <div id="loading">데이터를 불러오는 중입니다...</div>
        <div id="results-container"></div>
    </div>

    <script>
        // ----------------------------------------------------
        // 설정 영역
        // ----------------------------------------------------
        // 1. 웹 앱 배포 URL
        const API_URL = "https://script.google.com/macros/s/AKfycbw42mXcNkti5dTKKXo-dNpocNZyHNqcA7dIH_AQw2SQA5uRiRsJ1dBTu23iioWsZsI/exec"; 
        
        // 2. 3220의 SHA-256 해시값 (터미널에서 추출한 값으로 변경하세요)
        const TARGET_HASH = "698eddbc91b225fd427a99e6d0c194e32cb8c99dd4322cb25c5cd52c52184ef2"; 

        // ----------------------------------------------------
        // 전역 상태 변수
        // ----------------------------------------------------
        let globalData = [];
        let currentTab = 'substation'; // 변전소명 탭 기본값

        // ----------------------------------------------------
        // 유틸리티: SHA-256 해시 함수
        // ----------------------------------------------------
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ----------------------------------------------------
        // 이벤트: 로그인 처리 (엔터키 지원 포함)
        // ----------------------------------------------------
        async function handleLogin() {
            const pwd = document.getElementById('pwd-input').value;
            const hashedPwd = await sha256(pwd);

            if (hashedPwd === TARGET_HASH) {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('main-view').style.display = 'block';
                fetchData(); 
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        document.getElementById('login-btn').addEventListener('click', handleLogin);
        document.getElementById('pwd-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        // ----------------------------------------------------
        // 이벤트: 탭 전환 처리
        // ----------------------------------------------------
        document.getElementById('tab-substation').addEventListener('click', () => switchTab('substation'));
        document.getElementById('tab-region').addEventListener('click', () => switchTab('region'));

        function switchTab(tabName) {
            currentTab = tabName;
            const searchInput = document.getElementById('search-input');
            
            if (tabName === 'substation') {
                document.getElementById('tab-substation').classList.add('active');
                document.getElementById('tab-region').classList.remove('active');
                searchInput.placeholder = "예: 가락, 마포, 신길";
            } else {
                document.getElementById('tab-region').classList.add('active');
                document.getElementById('tab-substation').classList.remove('active');
                searchInput.placeholder = "예: 서울, 송파, 가락동";
            }
            
            searchInput.value = ""; 
            renderResults(); // 탭 전환 시 전체 목록으로 초기화
            searchInput.focus();
        }

        // ----------------------------------------------------
        // 이벤트: 수동 검색 실행 (버튼 클릭 및 엔터키)
        // ----------------------------------------------------
        function executeSearch() {
            const keyword = document.getElementById('search-input').value.trim();
            renderResults(keyword);
        }

        document.getElementById('search-btn').addEventListener('click', executeSearch);
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeSearch();
        });

        // ----------------------------------------------------
        // 데이터 로드 함수
        // ----------------------------------------------------
        async function fetchData() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            try {
                const response = await fetch(API_URL);
                const json = await response.json();
                
                if (json.status === "success") {
                    globalData = json.data;
                    renderResults(); 
                } else {
                    alert("데이터를 불러오지 못했습니다: " + json.message);
                }
            } catch (error) {
                alert("서버와 연결할 수 없습니다. 관리자에게 문의하세요.");
            } finally {
                loading.style.display = 'none';
            }
        }

        // ----------------------------------------------------
        // 결과 렌더링 함수 (카드 UI 7개년 생성)
        // ----------------------------------------------------
        function renderResults(keyword = "") {
            const container = document.getElementById('results-container');
            container.innerHTML = ""; 

            const searchKey = keyword.toLowerCase();
            
            const filteredData = globalData.filter(item => {
                if (searchKey === "") return true;
                
                if (currentTab === 'region') {
                    return item.region.toLowerCase().includes(searchKey);
                } else {
                    return item.substation.toLowerCase().includes(searchKey);
                }
            });

            if (filteredData.length === 0) {
                container.innerHTML = `<p style="text-align:center; font-size: 22px; margin-top:20px;">검색 결과가 없습니다.</p>`;
                return;
            }

            // 7개년 데이터 전체 노출
            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = "card";
                
                let kv23Html = "";
                let kv154Html = "";

                item.years.forEach((year, index) => {
                    kv23Html += `
                        <div class="data-row">
                            <span>${year}년</span>
                            <span class="capacity">${item.kv23[index]} MW</span>
                        </div>
                    `;
                    kv154Html += `
                        <div class="data-row">
                            <span>${year}년</span>
                            <span class="capacity">${item.kv154[index]} MW</span>
                        </div>
                    `;
                });
                
                card.innerHTML = `
                    <div class="card-title">${item.substation} 변전소</div>
                    <div class="card-region">${item.region}</div>
                    
                    <div style="background:#f0f0f0; padding:10px; border-radius:8px; margin-bottom:10px;">
                        <strong style="font-size:20px; color:#333;">22.9kV 여유용량</strong>
                        ${kv23Html}
                    </div>

                    <div style="background:#f0f0f0; padding:10px; border-radius:8px;">
                        <strong style="font-size:20px; color:#333;">154kV 여유용량</strong>
                        ${kv154Html}
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
