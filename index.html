<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한전 여유용량 조회</title>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
    :root {
        /* 🔵 메인 컬러: 시원하고 명확한 블루 (이어서 신청하기 버튼 색상) */
        --navy-900: #3182F6; /* 기본 버튼 및 주요 텍스트 */
        --navy-700: #1B64DA; /* 버튼 클릭 시 살짝 어두워지는 색상 */
        --navy-050: #E8F3FF; /* 탭 배경, 카드 눌렀을 때 배경 등 아주 연한 블루 */

        /* 🟢 포인트 컬러: 생동감 있는 에메랄드 그린 (Button 뱃지 색상) */
        --amber-500: #00BA66; /* 지도 보기 등 포인트 버튼 */
        --amber-100: #E0F8EC; /* 연한 녹색 배경 */
        --highlight-bg: #E0F8EC; /* 검색어 하이라이트(형광펜) 배경 */

        /* ⚪ 무채색 및 배경 */
        --bg: #F2F4F6;       /* 이미지의 배경과 유사한 부드러운 회백색 */
        --surface: #FFFFFF;  /* 카드 및 모달의 순백색 배경 */
        --text: #1B1F24;     /* 너무 까맣지 않아 눈이 편안한 진회색 */
        --text-muted: #5B6472; /* 부가 설명용 중간 회색 */
        --border: #E3E6EA;   /* 은은한 테두리 색상 */
        
        /* 🔴 경고/수치 컬러 (여유 용량 표시용으로 붉은빛 유지) */
        --cap-color: #D32F2F; 

        /* 📐 둥글기 (기존 유지) */
        --radius-lg: 18px;
        --radius-md: 12px;
        --radius-sm: 8px;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 24px 18px 60px;
    }

    /* ---------- 로그인 화면 ---------- */
    #login-view.container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-top: 0;
        padding-bottom: 0;
    }

    .login-card {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: 40px 28px;
        box-shadow: 0 8px 28px rgba(11, 42, 74, 0.10);
        text-align: center;
    }

    .login-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        background: var(--navy-050);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
    }

    h1 {
        font-size: 26px;
        font-weight: 800;
        text-align: center;
        margin: 0 0 10px;
        color: var(--navy-900);
        letter-spacing: -0.3px;
    }

    .login-sub {
        font-size: 17px;
        color: var(--text-muted);
        text-align: center;
        margin: 0 0 26px;
    }

    input[type="password"], input[type="text"] {
        width: 100%;
        padding: 18px 20px;
        font-size: 21px;
        font-family: inherit;
        border: 2px solid var(--border);
        border-radius: var(--radius-md);
        box-sizing: border-box;
        margin-bottom: 16px;
        background: var(--bg);
        color: var(--text);
        transition: border-color .15s ease, background .15s ease;
    }

    input[type="password"]:focus, input[type="text"]:focus {
        outline: none;
        border-color: var(--navy-700);
        background: var(--surface);
    }

    button {
        font-family: inherit;
        width: 100%;
        padding: 18px;
        font-size: 22px;
        font-weight: 700;
        background-color: var(--navy-900);
        color: white;
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background-color .12s ease, transform .06s ease;
        letter-spacing: -0.2px;
    }

    button:active { background-color: var(--navy-700); transform: scale(0.99); }

    #login-error {
        color: #C1432B;
        font-size: 16px;
        text-align: center;
        margin-top: 4px;
        display: none;
    }

    /* ---------- 메인 화면 ---------- */
    #main-view { display: none; }

    .page-header { margin-bottom: 22px; }
    .page-header h1 { text-align: left; font-size: 25px; margin-bottom: 4px; }
    .page-header p { margin: 0; font-size: 15px; color: var(--text-muted); }

    /* 탭 */
    .tabs {
        display: flex;
        gap: 4px;
        background: var(--navy-050);
        padding: 5px;
        border-radius: 999px;
        margin-bottom: 16px;
    }

    .tab-btn {
        flex: 1;
        background: transparent;
        color: var(--navy-700);
        font-size: 16px; /* 4개 탭이 한 줄에 들어가도록 폰트 조정 */
        font-weight: 700;
        padding: 13px 2px;
        border-radius: 999px;
        box-shadow: none;
        white-space: nowrap;
    }

    .tab-btn:active { transform: none; background: transparent; }

    .tab-btn.active {
        background-color: var(--navy-900);
        color: #fff;
        box-shadow: 0 2px 8px rgba(11,42,74,0.25);
    }

    /* 검색 영역 */
    .search-area { display: flex; gap: 10px; margin-bottom: 12px; }

    .search-area input[type="text"] {
        margin-bottom: 0;
        flex: 1;
        padding-left: 46px;
    }

    .search-wrap { position: relative; flex: 1; }
    .search-wrap .search-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 19px;
        opacity: .55;
        pointer-events: none;
    }

    .search-area button {
        width: 90px;
        margin-bottom: 0;
        font-size: 17px;
        padding: 0;
        background-color: var(--amber-500);
        color: var(--navy-900);
    }

    .search-area button:active { background-color: #C6892C; }

    /* 안내 / 결과 없음 메시지 */
    .msg-box {
        background: var(--surface);
        border: 1px dashed var(--border);
        border-radius: var(--radius-md);
        text-align: center;
        padding: 40px 20px;
        margin-bottom: 10px;
        font-size: 18px;
        color: var(--text-muted);
    }

    .msg-box.loading { color: var(--navy-700); border-style: solid; border-color: var(--navy-050); }
    .msg-box.error { color: #C1432B; }

    /* 카드 */
    .card {
        background: var(--surface);
        padding: 22px;
        border-radius: var(--radius-lg);
        box-shadow: 0 3px 14px rgba(11, 42, 74, 0.07);
        margin-bottom: 18px;
        border-left: 6px solid var(--navy-900);
    }

    /* 전체 보기용 심플 카드 */
    .card.simple-card {
        padding: 16px 20px;
        margin-bottom: 10px;
    }

    .card-title {
        font-size: 24px;
        font-weight: 800;
        color: var(--navy-900);
        margin-bottom: 4px;
        letter-spacing: -0.3px;
    }

    .card-region { font-size: 17px; color: var(--text-muted); margin-bottom: 16px; }

    mark.hl {
        background: var(--highlight-bg);
        color: var(--text);
        padding: 1px 3px;
        border-radius: 4px;
        font-weight: 800;
    }

    .voltage-block {
        background: var(--bg);
        padding: 14px 16px;
        border-radius: var(--radius-sm);
        margin-bottom: 12px;
    }

    .voltage-block:last-of-type { margin-bottom: 0; }

    .voltage-label {
        font-size: 18px;
        font-weight: 700;
        color: var(--navy-700);
        display: block;
        margin-bottom: 4px;
    }

    .data-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 19px;
        padding: 9px 0;
        border-bottom: 1px solid var(--border);
    }

    .data-row:last-child { border-bottom: none; }
    .data-row span:first-child { color: var(--text-muted); }

    .capacity {
        font-weight: 800;
        color: var(--cap-color);
        font-variant-numeric: tabular-nums;
    }

    /* 지도 영역 */
    .map-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

    .map-section-label {
        font-size: 16px;
        font-weight: 700;
        color: var(--navy-700);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .map-box {
        position: relative;
        border-radius: var(--radius-md);
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--navy-050);
        min-height: 190px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .map-status { font-size: 15px; color: var(--navy-700); text-align: center; padding: 20px; }

    .map-frame-link { display: block; position: relative; text-decoration: none; }

    .map-frame-link iframe {
        width: 100%;
        height: 220px;
        border: 0;
        display: block;
        pointer-events: none;
    }

    .map-open-badge {
        position: absolute;
        right: 10px;
        bottom: 10px;
        background: rgba(11, 42, 74, 0.88);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        padding: 7px 12px;
        border-radius: 999px;
        backdrop-filter: blur(2px);
    }

    .map-caption {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 8px;
        text-align: center;
    }

    .map-caption a, .map-fallback-link {
        color: var(--navy-900);
        font-weight: 700;
        text-decoration: none;
        border-bottom: 2px solid var(--amber-500);
    }

    .map-fallback-link { display: inline-block; margin-top: 10px; font-size: 15px; }

    /* IRONWEB 바로가기 카드 */
    .ironweb-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--surface);
        padding: 20px 22px;
        border-radius: var(--radius-lg);
        box-shadow: 0 3px 14px rgba(11, 42, 74, 0.07);
        border-left: 6px solid var(--amber-500);
        text-decoration: none;
        color: var(--navy-900);
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 18px;
    }

    .ironweb-card:active { background: var(--navy-050); }
    .ironweb-arrow { font-size: 20px; color: var(--amber-500); }

    .address-note {
        font-size: 15px;
        color: var(--navy-700);
        background: var(--navy-050);
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        margin-bottom: 12px;
    }
</style>
</head>
<body>

    <!-- 화면 A: 로그인 뷰 -->
    <div id="login-view" class="container">
        <div class="login-card">
            <div class="login-icon">🔒</div>
            <h1>여유용량 통합 검색</h1>
            <p class="login-sub">담당자 확인을 위해<br>비밀번호를 입력해 주세요.</p>
            <input type="password" id="pwd-input" placeholder="비밀번호 입력">
            <button id="login-btn">접속하기</button>
            <p id="login-error">비밀번호가 일치하지 않습니다.</p>
        </div>
    </div>

    <!-- 화면 B: 메인 검색 뷰 -->
    <div id="main-view" class="container">
        <div class="page-header">
            <h1>⚡ 여유용량 통합 검색</h1>
            <p>변전소명·지역명·주소로 위치와 여유용량을 확인하세요.</p>
        </div>

        <!-- 탭 버튼 -->
        <div class="tabs">
            <button id="tab-substation" class="tab-btn active">변전소명</button>
            <button id="tab-region" class="tab-btn">지역명</button>
            <button id="tab-address" class="tab-btn">주소</button>
            <button id="tab-all" class="tab-btn">전체</button>
        </div>

        <!-- 검색 입력창 & 버튼 -->
        <div class="search-area" id="search-area">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="예: 가락, 마포, 신길">
            </div>
            <button id="search-btn">검색</button>
        </div>

        <div id="results-container">
            <div class="msg-box">검색어를 입력해주세요.</div>
            <a class="ironweb-card" href="https://www.mav-ash.com/ironweb/?hl=ko-KR" target="_blank" rel="noopener">
                <span>🗺️ 한글 변전소 지도 보러가기</span>
                <span class="ironweb-arrow">↗</span>
            </a>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // 설정 영역
        // ----------------------------------------------------
        const API_URL = "https://script.google.com/macros/s/AKfycbw42mXcNkti5dTKKXo-dNpocNZyHNqcA7dIH_AQw2SQA5uRiRsJ1dBTu23iioWsZsI/exec";
        const TARGET_HASH = "698eddbc91b225fd427a99e6d0c194e32cb8c99dd4322cb25c5cd52c52184ef2";

        const OIM_BASE = "https://openinframap.org";
        const OIM_ZOOM_SUBSTATION = 16;
        const OIM_ZOOM_ADDRESS = 13;

        const IRONWEB_URL = "https://www.mav-ash.com/ironweb/?hl=ko-KR";
        const OSM_EMBED_URL = "https://www.openstreetmap.org/export/embed.html";
        const NOMINATIM_URL = "https://nominatim.openstreetmap.org/search";

        // ----------------------------------------------------
        // 전역 상태 변수
        // ----------------------------------------------------
        let globalData = [];
        let isDataLoaded = false;
        let currentTab = 'substation';
        let searchToken = 0; 
        const mapCache = {};

        // ----------------------------------------------------
        // 유틸리티
        // ----------------------------------------------------
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function highlightMatch(text, keyword) {
            const safeText = text == null ? "" : String(text);
            if (!keyword) return escapeHtml(safeText);
            const idx = safeText.toLowerCase().indexOf(keyword.toLowerCase());
            if (idx === -1) return escapeHtml(safeText);
            const before = safeText.slice(0, idx);
            const match = safeText.slice(idx, idx + keyword.length);
            const after = safeText.slice(idx + keyword.length);
            return `${escapeHtml(before)}<mark class="hl">${escapeHtml(match)}</mark>${escapeHtml(after)}`;
        }

        function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

        function ironwebCardHtml() {
            return `
                <a class="ironweb-card" href="${IRONWEB_URL}" target="_blank" rel="noopener">
                    <span>🗺️ 한글 변전소 지도 보러가기</span>
                    <span class="ironweb-arrow">↗</span>
                </a>`;
        }

        function setMsg(container, html) {
            container.innerHTML = html + ironwebCardHtml();
        }

        function buildOimUrl(lat, lng, zoom) {
            return `${OIM_BASE}/#${zoom}/${lat}/${lng}`;
        }

        function buildOsmEmbedUrl(lat, lng, delta) {
            const minLon = lng - delta;
            const maxLon = lng + delta;
            const minLat = lat - delta * 0.7;
            const maxLat = lat + delta * 0.7;
            const bbox = `${minLon},${minLat},${maxLon},${maxLat}`;
            return `${OSM_EMBED_URL}?bbox=${encodeURIComponent(bbox)}&layer=mapnik&marker=${encodeURIComponent(lat + ',' + lng)}`;
        }

        async function geocodeNominatimRaw(query) {
            const cacheKey = `nom:${query}`;
            if (cacheKey in mapCache) return mapCache[cacheKey];
            let result = null;
            try {
                const url = `${NOMINATIM_URL}?format=json&countrycodes=kr&limit=1&q=${encodeURIComponent(query)}`;
                const res = await fetch(url, { headers: { 'Accept-Language': 'ko' } });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0) {
                        result = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), label: data[0].display_name };
                    }
                }
            } catch (e) { result = null; }
            mapCache[cacheKey] = result;
            return result;
        }

        async function geocodeNominatim(query) {
            const tokens = query.trim().split(/\s+/);
            const minLen = Math.min(2, tokens.length);
            for (let len = tokens.length; len >= minLen; len--) {
                const attempt = tokens.slice(0, len).join(' ');
                const result = await geocodeNominatimRaw(attempt);
                if (result) {
                    result.approx = len < tokens.length; 
                    return result;
                }
                if (len > minLen) await sleep(300);
            }
            return null;
        }

        async function resolveSubstationLocation(name, region) {
            let coord = await geocodeNominatimRaw(`${name}변전소`);
            if (!coord) { await sleep(300); coord = await geocodeNominatim(region); }
            if (coord) return { lat: coord.lat, lng: coord.lng };
            return null;
        }

        // ----------------------------------------------------
        // 로그인 및 탭 전환
        // ----------------------------------------------------
        async function handleLogin() {
            const pwd = document.getElementById('pwd-input').value;
            const hashedPwd = await sha256(pwd);

            if (hashedPwd === TARGET_HASH) {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('main-view').style.display = 'block';
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        document.getElementById('login-btn').addEventListener('click', handleLogin);
        document.getElementById('pwd-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        document.getElementById('tab-substation').addEventListener('click', () => switchTab('substation'));
        document.getElementById('tab-region').addEventListener('click', () => switchTab('region'));
        document.getElementById('tab-address').addEventListener('click', () => switchTab('address'));
        document.getElementById('tab-all').addEventListener('click', () => switchTab('all'));

        async function switchTab(tabName) {
            currentTab = tabName;
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const searchArea = document.getElementById('search-area');

            ['substation', 'region', 'address', 'all'].forEach(name => {
                document.getElementById(`tab-${name}`).classList.toggle('active', name === tabName);
            });

            if (tabName === 'all') {
                searchArea.style.display = 'none'; // '전체' 탭에서는 검색창 숨김
                if (!isDataLoaded) {
                    await fetchAndSearch('', true);
                } else {
                    renderAllList();
                }
            } else {
                searchArea.style.display = 'flex'; // 다른 탭에서는 검색창 보임
                
                if (tabName === 'substation') {
                    searchInput.placeholder = "예: 가락, 마포, 신길";
                    searchBtn.textContent = "검색";
                } else if (tabName === 'region') {
                    searchInput.placeholder = "예: 서울, 송파, 가락동";
                    searchBtn.textContent = "검색";
                } else if (tabName === 'address') {
                    searchInput.placeholder = "예: 서울 중구 세종대로 110";
                    searchBtn.textContent = "지도보기";
                }

                searchInput.value = "";
                setMsg(document.getElementById('results-container'), `<div class="msg-box">검색어를 입력해주세요.</div>`);
                searchInput.focus();
            }
        }

        // ----------------------------------------------------
        // 데이터 패치
        // ----------------------------------------------------
        async function fetchAndSearch(keyword, isAllTab = false) {
            const container = document.getElementById('results-container');
            setMsg(container, `<div class="msg-box loading">데이터를 불러오는 중입니다...</div>`);

            try {
                const response = await fetch(API_URL);
                const json = await response.json();

                if (json.status === "success") {
                    globalData = json.data;
                    isDataLoaded = true;
                    
                    if (isAllTab) {
                        renderAllList();
                    } else {
                        renderResults(keyword);
                    }
                } else {
                    setMsg(container, `<div class="msg-box error">데이터 로드 실패: ${escapeHtml(json.message)}</div>`);
                }
            } catch (error) {
                setMsg(container, `<div class="msg-box error">서버와 연결할 수 없습니다.</div>`);
            }
        }

        async function executeSearch() {
            const keyword = document.getElementById('search-input').value.trim();
            const container = document.getElementById('results-container');

            if (keyword === "") {
                setMsg(container, `<div class="msg-box">검색어를 입력해주세요.</div>`);
                return;
            }

            if (currentTab === 'address') {
                await executeAddressSearch(keyword);
                return;
            }

            if (!isDataLoaded) {
                await fetchAndSearch(keyword);
            } else {
                renderResults(keyword);
            }
        }

        document.getElementById('search-btn').addEventListener('click', executeSearch);
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeSearch();
        });

        // ----------------------------------------------------
        // 전체 리스트 보기 렌더링 (가나다 정렬)
        // ----------------------------------------------------
        // ----------------------------------------------------
        // 전체 리스트 보기 렌더링 (아코디언 방식)
        // ----------------------------------------------------
        function renderAllList() {
            searchToken += 1;
            const container = document.getElementById('results-container');
            container.innerHTML = "";

            // 시도 > 시군구 > 변전소명 순서대로 정렬
            const sortedData = [...globalData].sort((a, b) => {
                const regionA = a.region || "";
                const regionB = b.region || "";
                if (regionA !== regionB) {
                    return regionA.localeCompare(regionB, 'ko-KR');
                }
                const subA = a.substation || "";
                const subB = b.substation || "";
                return subA.localeCompare(subB, 'ko-KR');
            });

            if (sortedData.length === 0) {
                setMsg(container, `<div class="msg-box">데이터가 없습니다.</div>`);
                return;
            }

            let html = ``;
            sortedData.forEach((item, idx) => {
                let kv23Html = "";
                let kv154Html = "";

                (item.years || []).forEach((year, i) => {
                    kv23Html += `
                        <div class="data-row">
                            <span>${escapeHtml(year)}년</span>
                            <span class="capacity">${escapeHtml(item.kv23[i])} MW</span>
                        </div>`;
                    kv154Html += `
                        <div class="data-row">
                            <span>${escapeHtml(year)}년</span>
                            <span class="capacity">${escapeHtml(item.kv154[i])} MW</span>
                        </div>`;
                });

                // 클릭 이벤트에 안전하게 텍스트를 전달하기 위한 처리
                const safeSub = escapeHtml(item.substation).replace(/'/g, "\\'");
                const safeReg = escapeHtml(item.region).replace(/'/g, "\\'");

                html += `
                    <div class="card" style="padding: 16px 20px; margin-bottom: 12px;">
                        <!-- 요약 헤더 (클릭 영역) -->
                        <div onclick="toggleAccordion(this, ${idx}, '${safeSub}', '${safeReg}')" style="cursor: pointer; -webkit-tap-highlight-color: transparent;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div class="card-title" style="font-size: 21px; margin-bottom: 2px;">${escapeHtml(item.substation)} 변전소</div>
                                <div class="accordion-arrow" style="font-size: 16px; color: var(--navy-700);">▼</div>
                            </div>
                            <div class="card-region" style="font-size: 16px; margin-bottom: 0;">${escapeHtml(item.region)}</div>
                        </div>

                        <!-- 숨겨진 상세 내용 (용량 + 지도) -->
                        <div class="card-details" style="display: none; margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 16px;">
                            <div class="voltage-block">
                                <span class="voltage-label">22.9kV 여유용량</span>
                                ${kv23Html}
                            </div>
                            <div class="voltage-block">
                                <span class="voltage-label">154kV 여유용량</span>
                                ${kv154Html}
                            </div>
                            <div class="map-section">
                                <div class="map-section-label">🗺️ 변전소 위치</div>
                                <div class="map-box" id="map-all-${idx}" data-loaded="false">
                                    <div class="map-status">지도 위치를 찾는 중...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.insertAdjacentHTML('beforeend', ironwebCardHtml());
        }

        // ----------------------------------------------------
        // 아코디언 열기/닫기 및 지도 지연 로딩
        // ----------------------------------------------------
        async function toggleAccordion(element, idx, substation, region) {
            const card = element.closest('.card');
            const details = card.querySelector('.card-details');
            const arrow = element.querySelector('.accordion-arrow');

            if (details.style.display === 'none') {
                // 펼치기
                details.style.display = 'block';
                arrow.textContent = '▲';

                // 지도가 아직 안 불려왔다면 지금 호출 (성능 최적화)
                const mapBox = document.getElementById(`map-all-${idx}`);
                if (mapBox && mapBox.getAttribute('data-loaded') === 'false') {
                    mapBox.setAttribute('data-loaded', 'true');
                    
                    const loc = await resolveSubstationLocation(substation, region);
                    if (loc) {
                        const previewUrl = buildOsmEmbedUrl(loc.lat, loc.lng, 0.004);
                        const oimUrl = buildOimUrl(loc.lat, loc.lng, OIM_ZOOM_SUBSTATION);
                        mapBox.outerHTML = `
                            <div class="map-box" id="map-all-${idx}" data-loaded="true">
                                <a class="map-frame-link" href="${oimUrl}" target="_blank" rel="noopener"
                                   aria-label="${escapeHtml(substation)} 변전소 위치, 새 창에서 크게 보기">
                                    <iframe src="${previewUrl}" loading="lazy" tabindex="-1"></iframe>
                                    <span class="map-open-badge">새 창에서 크게 보기 ↗</span>
                                </a>
                            </div>`;
                    } else {
                        mapBox.innerHTML = `<div class="map-status">위치를 찾지 못했습니다.</div>`;
                    }
                }
            } else {
                // 접기
                details.style.display = 'none';
                arrow.textContent = '▼';
            }
        }

        // ----------------------------------------------------
        // 변전소명 / 지역명 검색 결과 렌더링
        // ----------------------------------------------------
        function renderResults(keyword) {
            searchToken += 1;
            const myToken = searchToken;

            const container = document.getElementById('results-container');
            container.innerHTML = "";

            const searchKey = keyword.toLowerCase();

            const filteredData = globalData.filter(item => {
                if (currentTab === 'region') {
                    return (item.region || "").toLowerCase().includes(searchKey);
                } else {
                    return (item.substation || "").toLowerCase().includes(searchKey);
                }
            });

            if (filteredData.length === 0) {
                setMsg(container, `<div class="msg-box">검색 결과가 없습니다.</div>`);
                return;
            }

            const mapTargets = [];

            filteredData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = "card";

                const titleHtml = currentTab === 'substation'
                    ? highlightMatch(item.substation, keyword)
                    : escapeHtml(item.substation);
                const regionHtml = currentTab === 'region'
                    ? highlightMatch(item.region, keyword)
                    : escapeHtml(item.region);

                let kv23Html = "";
                let kv154Html = "";

                (item.years || []).forEach((year, i) => {
                    kv23Html += `
                        <div class="data-row">
                            <span>${escapeHtml(year)}년</span>
                            <span class="capacity">${escapeHtml(item.kv23[i])} MW</span>
                        </div>`;
                    kv154Html += `
                        <div class="data-row">
                            <span>${escapeHtml(year)}년</span>
                            <span class="capacity">${escapeHtml(item.kv154[i])} MW</span>
                        </div>`;
                });

                const mapBoxId = `mapbox-${idx}`;

                card.innerHTML = `
                    <div class="card-title">${titleHtml} 변전소</div>
                    <div class="card-region">${regionHtml}</div>

                    <div class="voltage-block">
                        <span class="voltage-label">22.9kV 여유용량</span>
                        ${kv23Html}
                    </div>

                    <div class="voltage-block">
                        <span class="voltage-label">154kV 여유용량</span>
                        ${kv154Html}
                    </div>

                    ${currentTab === 'substation' ? `
                    <div class="map-section">
                        <div class="map-section-label">🗺️ 변전소 위치</div>
                        <div class="map-box" id="${mapBoxId}">
                            <div class="map-status">지도 위치를 찾는 중...</div>
                        </div>
                    </div>` : ``}
                `;
                container.appendChild(card);

                if (currentTab === 'substation') {
                    mapTargets.push({ boxId: mapBoxId, substation: item.substation, region: item.region });
                }
            });

            if (mapTargets.length > 0) {
                loadCardMapsSequentially(mapTargets, myToken);
            }

            container.insertAdjacentHTML('beforeend', ironwebCardHtml());
        }

        async function loadCardMapsSequentially(targets, myToken) {
            for (const target of targets) {
                if (myToken !== searchToken) return;

                const box = document.getElementById(target.boxId);
                if (!box) continue;

                const loc = await resolveSubstationLocation(target.substation, target.region);

                if (myToken !== searchToken) return;
                if (!box.isConnected) continue;

                if (loc) {
                    const previewUrl = buildOsmEmbedUrl(loc.lat, loc.lng, 0.004);
                    const oimUrl = buildOimUrl(loc.lat, loc.lng, OIM_ZOOM_SUBSTATION);
                    box.outerHTML = `
                        <div class="map-box" id="${target.boxId}">
                            <a class="map-frame-link" href="${oimUrl}" target="_blank" rel="noopener"
                               aria-label="${escapeHtml(target.substation)} 변전소 위치, 새 창에서 크게 보기">
                                <iframe src="${previewUrl}" loading="lazy" tabindex="-1"
                                        title="${escapeHtml(target.substation)} 변전소 위치"></iframe>
                                <span class="map-open-badge">새 창에서 크게 보기 ↗</span>
                            </a>
                        </div>`;
                } else {
                    box.innerHTML = `<div class="map-status">위치를 찾지 못했습니다.</div>`;
                }

                await sleep(300); 
            }
        }

        // ----------------------------------------------------
        // 주소로 주변 변전소 지도 보기
        // ----------------------------------------------------
        async function executeAddressSearch(address) {
            searchToken += 1;
            const myToken = searchToken;

            const container = document.getElementById('results-container');
            setMsg(container, `<div class="msg-box loading">주소를 찾는 중입니다...</div>`);

            const coord = await geocodeNominatim(address);

            if (myToken !== searchToken) return;

            if (!coord) {
                setMsg(container, `<div class="msg-box error">주소를 찾지 못했습니다. 도로명까지만 다시 입력해보세요.</div>`);
                return;
            }

            const previewUrl = buildOsmEmbedUrl(coord.lat, coord.lng, 0.012);
            const oimUrl = buildOimUrl(coord.lat, coord.lng, OIM_ZOOM_ADDRESS);
            const approxNote = coord.approx ? `<div class="map-caption" style="margin-top:0;margin-bottom:8px;">※ 근사 위치입니다</div>` : ``;

            setMsg(container, `
                <div class="card">
                    <div class="address-note">📍 ${escapeHtml(coord.label || address)}</div>
                    ${approxNote}
                    <div class="map-box">
                        <a class="map-frame-link" href="${oimUrl}" target="_blank" rel="noopener"
                           aria-label="주소 주변 지도, 새 창에서 크게 보기">
                            <iframe src="${previewUrl}" loading="lazy" tabindex="-1" title="주소 주변 지도"></iframe>
                            <span class="map-open-badge">새 창에서 크게 보기 ↗</span>
                        </a>
                    </div>
                </div>`);
        }
    </script>
</body>
</html>
